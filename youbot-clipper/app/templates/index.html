<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Youbot Shorts Clipper</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1e222b;
      --text: #e7ebf2; --muted: #9aa4b2; --accent: #ff3d5a;
      --accent2: #3d7bff; --ok: #2ecc71; --border: #262b36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      position: sticky; top: 0; background: rgba(15,17,21,.9); backdrop-filter: blur(8px); z-index: 5;
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    h1 span { color: var(--accent); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .start-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: transform .05s ease, opacity .2s ease;
    }
    .start-btn:hover { transform: translateY(-1px); }
    .start-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .status {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 24px;
    }
    .status-row { display: flex; align-items: center; gap: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.running { background: var(--accent2); animation: pulse 1.1s infinite; }
    .dot.done { background: var(--ok); }
    .dot.error { background: var(--accent); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .status-msg { font-size: 14px; }
    .log {
      margin-top: 12px; max-height: 160px; overflow: auto; font-family: ui-monospace, monospace;
      font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 8px; padding: 10px 12px;
      white-space: pre-wrap; display: none;
    }
    .log.show { display: block; }
    .toggle-log { background: none; border: none; color: var(--accent2); cursor: pointer; font-size: 12px; padding: 6px 0 0; }
    .bl-info { font-size: 12px; color: var(--muted); margin-left: 14px; }
    .bl-info a { color: var(--accent2); cursor: pointer; text-decoration: none; }
    .grid {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .card video, .card .poster {
      width: 100%; aspect-ratio: 9/16; background: #000; object-fit: cover; display: block;
    }
    .card .poster {
      display: flex; align-items: center; justify-content: center; color: var(--muted);
      cursor: pointer; position: relative;
    }
    .card .poster img { width: 100%; height: 100%; object-fit: cover; }
    .card .poster .play {
      position: absolute; width: 52px; height: 52px; border-radius: 50%;
      background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center;
    }
    .card .poster .play::after {
      content: ""; border-left: 16px solid #fff; border-top: 10px solid transparent;
      border-bottom: 10px solid transparent; margin-left: 4px;
    }
    .card-body { padding: 10px 12px; }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin: 0 0 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; justify-content: space-between; }
    .card-actions { display: flex; gap: 8px; margin-top: 8px; }
    .card-actions a { font-size: 11px; color: var(--accent2); text-decoration: none; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
      margin: 0 0 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Youbot <span>Shorts</span> Clipper</h1>
    <button id="startBtn" class="start-btn">▶ Start</button>
  </header>

  <div class="wrap">
    <div class="status">
      <div class="status-row">
        <span id="dot" class="dot"></span>
        <span id="statusMsg" class="status-msg">Ready.</span>
      </div>
      <button id="toggleLog" class="toggle-log">Show log</button>
      <span id="blacklistInfo" class="bl-info"></span>
      <div id="log" class="log"></div>
    </div>

    <div class="status" id="autopilotCard">
      <div class="status-row" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:12px">
          <span id="apDot" class="dot"></span>
          <strong style="font-size:14px">Autopilot</strong>
          <span id="apSummary" class="status-msg" style="color:var(--muted)"></span>
        </div>
        <button id="apToggle" class="start-btn" style="padding:8px 16px;font-size:13px">Start Autopilot</button>
      </div>
      <div id="apDetail" class="status-msg" style="color:var(--muted);margin-top:8px;font-size:13px"></div>
    </div>

    <p class="section-title">Gallery</p>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">
      No clips yet. Press <strong>Start</strong> to make your first Short.
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let polling = false;

    async function refreshClips() {
      try {
        const res = await fetch("api/clips");
        const data = await res.json();
        const grid = $("grid");
        const clips = data.clips || [];
        $("empty").style.display = clips.length ? "none" : "block";
        grid.innerHTML = clips.map(cardHtml).join("");
      } catch (e) { /* ignore transient errors */ }
    }

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function cardHtml(c) {
      const date = c.created_at ? new Date(c.created_at).toLocaleString() : "";
      const poster = c.thumbnail
        ? `<div class="poster" onclick="playClip(this,'${esc(c.filename)}')">
             <img src="thumbs/${encodeURIComponent(c.thumbnail)}" alt="">
             <span class="play"></span>
           </div>`
        : `<div class="poster" onclick="playClip(this,'${esc(c.filename)}')">
             <span class="play"></span>
           </div>`;
      return `<div class="card">
        ${poster}
        <div class="card-body">
          <p class="card-title" title="${esc(c.title)}">${esc(c.title)}</p>
          <div class="card-meta">
            <span>${esc(c.channel)}</span>
            <span>${c.size_mb ? c.size_mb + " MB" : ""}</span>
          </div>
          <div class="card-actions">
            <a href="clips/${encodeURIComponent(c.filename)}" download>Download</a>
            ${c.source_url ? `<a href="${esc(c.source_url)}" target="_blank" rel="noopener">Source</a>` : ""}
          </div>
          <div class="card-meta" style="margin-top:6px"><span>${date}</span></div>
        </div>
      </div>`;
    }

    function playClip(el, filename) {
      const v = document.createElement("video");
      v.src = "clips/" + encodeURIComponent(filename);
      v.controls = true; v.autoplay = true;
      el.replaceWith(v);
    }

    function applyStatus(s) {
      const dot = $("dot");
      dot.className = "dot" + (s.running ? " running" : s.error ? " error" : s.step === "done" ? " done" : "");
      $("statusMsg").textContent = s.message || "Ready.";
      $("log").textContent = (s.log || []).join("\n");
      $("startBtn").disabled = !!s.running;
      $("startBtn").textContent = s.running ? "Working…" : "▶ Start";
    }

    async function pollStatus() {
      try {
        const res = await fetch("api/status");
        const s = await res.json();
        applyStatus(s);
        if (s.running) {
          if (!polling) { polling = true; setTimeout(loop, 1500); }
        } else {
          polling = false;
          refreshClips();
          refreshBlacklist();
        }
      } catch (e) { polling = false; }
    }

    async function refreshBlacklist() {
      try {
        const res = await fetch("api/blacklist");
        const d = await res.json();
        $("blacklistInfo").innerHTML =
          `${d.count} video(s) used · <a id="resetBl">reset</a>`;
        const rb = $("resetBl");
        if (rb) rb.onclick = resetBlacklist;
      } catch (e) { /* ignore */ }
    }

    async function resetBlacklist() {
      if (!confirm("Clear the used-video list? Videos can then be picked again.")) return;
      await fetch("api/blacklist/reset", { method: "POST" });
      refreshBlacklist();
    }

    async function loop() {
      await pollStatus();
      if (polling) setTimeout(loop, 1500);
    }

    $("startBtn").addEventListener("click", async () => {
      $("startBtn").disabled = true;
      const res = await fetch("api/start", { method: "POST" });
      if (res.status === 409) { $("startBtn").disabled = false; }
      pollStatus();
    });

    $("toggleLog").addEventListener("click", () => {
      const log = $("log");
      const showing = log.classList.toggle("show");
      $("toggleLog").textContent = showing ? "Hide log" : "Show log";
    });

    async function refreshAutopilot() {
      try {
        const res = await fetch("api/autopilot");
        const a = await res.json();
        $("apDot").className = "dot" + (a.enabled ? (a.generating ? " running" : " done") : "");
        $("apToggle").textContent = a.enabled ? "Stop Autopilot" : "Start Autopilot";
        const next = a.next_upload_at ? new Date(a.next_upload_at).toLocaleTimeString() : "—";
        $("apSummary").textContent = a.enabled
          ? `queue ${a.queue_len} · uploaded ${a.uploaded} · next ${next}`
          : "off";
        let detail = a.last_result || "";
        if (a.generating && a.gen) detail = "Generating: " + a.gen.message;
        $("apDetail").textContent = detail;
      } catch (e) { /* ignore */ }
    }

    $("apToggle").addEventListener("click", async () => {
      const res = await fetch("api/autopilot");
      const a = await res.json();
      if (a.enabled) {
        await fetch("api/autopilot/stop", { method: "POST" });
      } else {
        const r = await fetch("api/autopilot/start", { method: "POST" });
        if (r.status === 400) {
          const d = await r.json();
          alert(d.message || "Could not start autopilot.");
        }
      }
      refreshAutopilot();
    });

    setInterval(refreshAutopilot, 5000);

    pollStatus();
    refreshClips();
    refreshBlacklist();
    refreshAutopilot();
  </script>
</body>
</html>
