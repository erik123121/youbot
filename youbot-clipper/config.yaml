name: Youbot Shorts Clipper
version: "0.3.0"
slug: youbot_clipper
description: Turns podcast episodes into vertical Shorts with GTA gameplay on the bottom half.
url: https://github.com/erik123121/youbot/tree/main/youbot-clipper
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
# Direct access at http://<host>:8099 (localhost site) in addition to the HA sidebar.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI (gallery + Start button)
# In-sidebar view via Home Assistant ingress.
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-play
panel_title: Shorts Clipper
# Persistent /data (gameplay cache, metadata) is automatic.
# Map the HA media folder so finished shorts show in the Media browser.
map:
  - media:rw
  - share:rw
options:
  gameplay_url: "https://youtu.be/ZtLrNBdXT7M"
  podcast_channels:
    - "https://www.youtube.com/@joerogan"
    - "https://www.youtube.com/@TheoVon"
  channel_scan_limit: 500
  clip_seconds: 35
  output_dir: "/media/youbot"
  max_source_minutes: 600
  openai_api_key: ""
  openai_model: "gpt-4.1-nano"
  youtube_client_id: ""
  youtube_client_secret: ""
  youtube_refresh_token: ""
  upload_privacy: "public"
  upload_min_hours: 2
  upload_max_hours: 5
  auto_update_addon: true
  auto_update_ytdlp: true
schema:
  gameplay_url: url
  podcast_channels:
    - str
  channel_scan_limit: int(10,5000)
  clip_seconds: int(5,40)
  output_dir: str
  max_source_minutes: int(1,1200)
  openai_api_key: "str?"
  openai_model: str
  youtube_client_id: "str?"
  youtube_client_secret: "str?"
  youtube_refresh_token: "str?"
  upload_privacy: "list(public|unlisted|private)"
  upload_min_hours: int(1,48)
  upload_max_hours: int(1,48)
  auto_update_addon: bool
  auto_update_ytdlp: bool
