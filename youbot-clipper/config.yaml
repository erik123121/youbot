name: Youbot Shorts Clipper
version: "0.1.5"
slug: youbot_clipper
description: Turns trending YouTube videos into vertical Shorts with GTA gameplay on the bottom half.
url: https://github.com/erik123121/youbot/tree/main/youbot-clipper
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
# Direct access at http://<host>:8099 (localhost site) in addition to the HA sidebar.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI (gallery + Start button)
# In-sidebar view via Home Assistant ingress.
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-play
panel_title: Shorts Clipper
# Persistent /data (gameplay cache, metadata) is automatic.
# Map the HA media folder so finished shorts show in the Media browser.
map:
  - media:rw
  - share:rw
options:
  gameplay_url: "https://youtu.be/ZtLrNBdXT7M"
  trending_region: "US"
  candidate_count: 30
  clip_seconds: 35
  output_dir: "/media/youbot"
  max_source_minutes: 30
  openai_api_key: ""
  openai_model: "gpt-4.1-nano"
  auto_update_addon: true
  auto_update_ytdlp: true
schema:
  gameplay_url: url
  trending_region: str
  candidate_count: int(1,100)
  clip_seconds: int(5,40)
  output_dir: str
  max_source_minutes: int(1,240)
  openai_api_key: "str?"
  openai_model: str
  auto_update_addon: bool
  auto_update_ytdlp: bool
